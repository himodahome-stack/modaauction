<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>FormSubmit 진단</title>
  <style>body{font-family:monospace;padding:20px;line-height:1.5}pre{white-space:pre-wrap;background:#f4f4f4;padding:12px;border:1px solid #ccc}</style>
</head>
<body>
  <h1>FormSubmit 진단 페이지</h1>
  <p>아래 버튼을 누르면 formsubmit.co AJAX 엔드포인트로 실제 요청을 보내고 결과를 그대로 표시합니다.</p>
  <button id="go">요청 보내기</button>
  <pre id="out">대기 중</pre>
  <script>
    document.getElementById('go').addEventListener('click', async function () {
      var out = document.getElementById('out');
      out.textContent = '요청 중...';
      var info = {
        origin: location.origin,
        ua: navigator.userAgent,
        steps: []
      };
      try {
        var res = await fetch('https://formsubmit.co/ajax/hi.modahome@gmail.com', {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            _subject: '[진단] 모다경매 신청 폼 연동 확인',
            _template: 'table',
            _captcha: 'false',
            name: '진단 요청',
            message: '홈페이지 신청 폼 연동 상태 확인용 요청입니다.'
          })
        });
        info.steps.push({ step: 'fetch resolved', status: res.status, type: res.type, ok: res.ok });
        info.headers = {};
        res.headers.forEach(function (v, k) { info.headers[k] = v; });
        info.body = (await res.text()).slice(0, 2000);
      } catch (err) {
        info.steps.push({ step: 'fetch rejected', name: err && err.name, message: String(err && err.message) });
      }
      out.textContent = JSON.stringify(info, null, 2);
    });
  </script>
</body>
</html>
